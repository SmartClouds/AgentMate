name: Tests

# Unit, integration, mobile and end-to-end tests. Called by CI on every push and pull request,
# and by CD before anything is built for a release, so a broken test cannot ship.
#
# CI runs everything on our self-hosted Linux runner. CD runs on GitHub's hosted runners only
# (github-hosted: true), which is also the one place the end-to-end tests run on Windows and
# macOS, since we have no self-hosted runner for either.
#
# Every job here is independent of the others (only the merge and WordPress sync jobs wait for
# another), so they all start at once when there are enough runners. The slow suites are split
# into shards for the same reason.
#
# The pnpm and NuGet caches only go through GitHub's cache on hosted runners. A self-hosted runner
# keeps its pnpm store and ~/.nuget between jobs, and uploading and downloading them through
# GitHub took about a minute and a half per job there.

on:
  workflow_call:
    inputs:
      e2e:
        description: Run the Electron end-to-end matrix
        type: boolean
        default: true
      github-hosted:
        description: Run on GitHub's hosted runners instead of the self-hosted Linux runner
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Electron end-to-end matrix
        type: boolean
        default: true
      github-hosted:
        description: Run on GitHub's hosted runners instead of the self-hosted Linux runner
        type: boolean
        default: false

permissions:
  contents: read

# A called workflow does not inherit the caller's env, so CI sets this here too. See ci.yml for why
# onnxruntime-node's NuGet download is skipped.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  unit:
    name: Unit and integration (core, protocol)
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Some tests build a real repository in a temp folder and commit to it, which git refuses
      # to do without an identity.
      - name: Git identity for fixtures
        run: |
          git config --global user.name "AgentMate CI"
          git config --global user.email "ci@agentmate.invalid"
          git config --global init.defaultBranch main

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Core and protocol
        run: pnpm --filter @agentmat/core --filter @agentmat/protocol test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs packages/core packages/protocol >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          retention-days: 14
          if-no-files-found: ignore
          path: |
            packages/core/coverage
            packages/core/test-results
            packages/protocol/coverage
            packages/protocol/test-results

  # The desktop suite is the slowest one, so it runs in shards on as many runners as are free.
  # Each shard leaves a blob report with its share of the coverage, and desktop-unit below merges
  # them. The coverage thresholds are checked only there (vitest.config.mts skips them in a shard).
  desktop-unit-shard:
    name: Desktop unit (${{ matrix.shard }}/3)
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Git identity for fixtures
        run: |
          git config --global user.name "AgentMate CI"
          git config --global user.email "ci@agentmate.invalid"
          git config --global init.defaultBranch main

      # The desktop tests import @agentmat/core and @agentmat/protocol from their build output.
      - name: Build workspace packages
        run: pnpm build:packages

      # The blob reporter alone prints nothing about a failure, so dot is added for the log: one
      # character per test, then every failure in full. The merge job adds the annotations.
      - name: Desktop main and renderer
        working-directory: apps/desktop
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/3 --reporter=blob --reporter=dot

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-blob-${{ matrix.shard }}
          retention-days: 1
          include-hidden-files: true
          path: apps/desktop/.vitest/blob

  desktop-unit:
    name: Desktop unit (merge and coverage)
    if: ${{ !cancelled() }}
    needs: desktop-unit-shard
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-blob-*
          merge-multiple: true
          path: apps/desktop/.vitest/blob

      # Fails when a shard had a failing test, or when the merged coverage is under a threshold.
      # A shard that never finished leaves no blob, so the count is checked first.
      - name: Merge reports and check coverage
        working-directory: apps/desktop
        run: |
          count="$(find .vitest/blob -name 'blob-*.json' | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "::error title=Missing shard::Expected 3 desktop blob reports, found $count."
            exit 1
          fi
          pnpm exec vitest run --merge-reports --coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs apps/desktop >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-desktop
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/desktop/coverage
            apps/desktop/test-results

  # The AgentMate Connector WordPress plugin (apps/wordpress-connector, E19). PHP runs in Docker
  # containers, the same way as on a developer's machine: PHPUnit (including the shared protocol
  # vectors), `php -l` on PHP 7.4, 8.0, 8.3 and 8.4, the PHP 7.4+ compatibility and WordPress
  # security sniffs, and the zip build with its version check.
  wordpress-connector:
    name: WordPress connector
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Unit tests
        run: node scripts/wordpress-connector.mjs test

      - name: Lint on every supported PHP
        run: node scripts/wordpress-connector.mjs lint

      - name: Compatibility and security sniffs
        run: node scripts/wordpress-connector.mjs compat

      - name: Build the plugin zip
        run: node scripts/wordpress-connector.mjs build

      - name: Smoke test on real WordPress
        run: node scripts/wordpress-connector.mjs smoke

  # The desktop's WordPress sync engine against the real plugin on WordPress in Docker (E19 T10):
  # pairing, a new project, a deploy with agent files left in the theme (none may reach the site),
  # a refused syntax error, a fatal error rolled back by the site's guard, a manual rollback and a
  # read-only key. Runs with the other system tests, on [e2e].
  wordpress-integration:
    name: WordPress sync on real WordPress
    if: ${{ inputs.e2e }}
    needs: wordpress-connector
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Sync engine against the connector
        env:
          AGENTMATE_SYSTEM_TESTS: "1"
        run: pnpm --filter @agentmat/desktop exec vitest run src/main/deploy/wordpress/wordpress.int.test.ts

  # The .NET server core (apps/server-core). Its global.json pins the SDK feature band and the
  # Microsoft.Testing.Platform runner, so every dotnet command runs from that folder. System tests
  # (real Docker, test servers) are not part of this job; they run in the [e2e] job instead.
  server-core:
    name: Server core
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The feature band, not an exact patch, so release builds pick up the newest runtime fixes.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: ${{ inputs.github-hosted }}
          cache-dependency-path: apps/server-core/**/packages.lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Locked: the lock files are what was reviewed. Known high or critical vulnerabilities fail
      # this step through NuGet audit.
      - name: Restore
        working-directory: apps/server-core
        run: dotnet restore AgentMate.ServerCore.slnx --locked-mode

      - name: Format
        working-directory: apps/server-core
        run: dotnet format AgentMate.ServerCore.slnx --verify-no-changes --no-restore

      - name: Build
        working-directory: apps/server-core
        run: dotnet build AgentMate.ServerCore.slnx --no-restore --configuration Release

      - name: Unit and integration tests
        working-directory: apps/server-core
        run: dotnet test --project tests/AgentMate.ServerCore.Tests --no-build --configuration Release

      # The desktop's TypeScript contracts are generated from the C# ones. Regenerating must not
      # change anything, or someone changed a contract without committing the new TypeScript.
      - name: Contracts drift
        run: |
          node scripts/server-core.mjs contracts
          drift="$(git status --porcelain -- apps/desktop/src/shared/deploy/protocol/generated)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff -- apps/desktop/src/shared/deploy/protocol/generated
            echo "::error title=Contracts drift::Run 'pnpm server-core:contracts' and commit the result."
            exit 1
          fi

  # The server core installed on real Linux machines: systemd test servers in Docker (Ubuntu
  # 24.04 and Rocky 9), logged in as root and as a user whose sudo asks for a password, driven by
  # the desktop's own installer, pool and REST client. Also a tampered download, a release that
  # will not start (it must roll back), and sshd with tunnels switched off (the bridge).
  server-core-system:
    name: Server core on test servers
    if: ${{ inputs.e2e }}
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: ${{ inputs.github-hosted }}
          cache-dependency-path: apps/server-core/**/packages.lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Publish the linux-x64 release
        run: node scripts/server-core.mjs publish linux-x64

      # Ubuntu's AppArmor has a profile that confines any unix_chkpwd by its path, the Rocky test
      # server's own included, since containers share the host's profiles. Confined, it cannot read
      # /etc/shadow and every password login fails. A real Rocky server has no such profile.
      - name: Let the Rocky test server check passwords
        run: |
          if sudo grep -q '^unix-chkpwd ' /sys/kernel/security/apparmor/profiles 2>/dev/null; then
            echo -n unix-chkpwd | sudo tee /sys/kernel/security/apparmor/.remove > /dev/null
            echo "Unloaded the runner's unix-chkpwd AppArmor profile."
          fi

      # Built up front, so the image builds do not count against each test's time limit.
      - name: Build the test servers
        run: |
          for image in ubuntu-24.04 rocky-9 ubuntu-24.04-ufw rocky-9-firewalld; do
            docker build -q -t "agentmate-test-server:$image" "apps/server-core/test-servers/$image"
          done

      # One vitest run, two files at a time. Every test server is its own container with a unique
      # name and a random SSH port, so the files cannot see each other. The install file alone takes
      # about as long as the other four together, so two workers is about half the time of running
      # them one by one, without loading the runner with five sets of containers at once.
      #
      # deploy: the install itself, on Ubuntu and Rocky, as root and as a sudo user.
      # firewall: ufw and firewalld, live IPv4 and IPv6 rulesets, the SSH lockout guard, confirming
      #   over a new SSH connection, and a rollback by the systemd timer with the core killed.
      # registries: a private registry:2 with htpasswd; a deploy pulls with a per-deploy token, and
      #   after a success and a failure the whole filesystem holds no trace of it (E08).
      # directTls: direct TLS (E16) behind ufw, mutual TLS with the device key, strangers, a wrong
      #   pin and a revoked device refused, and the port and rule gone when it is off.
      # deployExec: the Deploy AI's shell (E09), an allowlisted check in a real transient unit, an
      #   unapproved command refused, a signed one run once and its replay refused, the journal.
      - name: System tests on test servers
        env:
          AGENTMATE_SYSTEM_TESTS: "1"
        run: >-
          pnpm --filter @agentmat/desktop exec vitest run --maxWorkers=2
          src/main/deploy/deploy.int.test.ts
          src/main/deploy/firewall.int.test.ts
          src/main/deploy/registries.int.test.ts
          src/main/deploy/directTls.int.test.ts
          src/main/deploy/deployExec.int.test.ts

  mobile:
    name: Mobile
    runs-on: ${{ inputs.github-hosted && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Jest
        run: pnpm --filter @agentmat/mobile test:ci

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs apps/mobile >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mobile
          retention-days: 14
          if-no-files-found: ignore
          path: apps/mobile/coverage

  # On the self-hosted runner this is Linux only. Windows and macOS run only when CD calls this on
  # GitHub's hosted runners.
  #
  # The specs run one Electron at a time (see e2e/playwright.config.ts), so the suite is split into
  # shards by spec file instead, each on its own runner.
  e2e:
    name: E2E (${{ matrix.target.name }}, ${{ matrix.shard }}/3)
    if: ${{ inputs.e2e }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.github-hosted && '[{"name":"ubuntu-latest","runner":"ubuntu-latest"},{"name":"windows-latest","runner":"windows-latest"},{"name":"macos-latest","runner":"macos-latest"}]' || '[{"name":"linux","runner":["self-hosted","Linux","X64"]}]') }}
        shard: [1, 2, 3]
    env:
      # One cache location on every OS, so the Electron zip can be restored between runs.
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Display and Electron libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # The self-hosted runner keeps what it installed, so only reach for apt when needed.
          # Everything Electron links against. GitHub's hosted images ship most of these already,
          # a plain Ubuntu server does not (GTK and ATK above all).
          installed() { dpkg-query -W -f='${Status}' "$1" 2> /dev/null | grep -q "install ok installed"; }
          missing=""
          for p in xvfb libnss3 libnspr4 libgbm1 libdrm2 libxss1 libxtst6 libx11-6 libxcb1 libxext6 \
            libxfixes3 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libdbus-1-3 libpango-1.0-0 \
            libcairo2 libwayland-client0 libasound2 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libglib2.0-0 libgtk-3-0; do
            # Ubuntu 24.04 renamed some of these with a t64 suffix (libasound2t64, libgtk-3-0t64, ...).
            if installed "$p" || installed "${p}t64"; then continue; fi
            if apt-cache show "${p}t64" > /dev/null 2>&1; then
              missing="$missing ${p}t64"
            else
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            if ! sudo -n true 2> /dev/null; then
              echo "::error::Missing system packages:$missing. This runner has no passwordless sudo, so install them on the runner host: sudo apt-get install -y$missing"
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y $missing
          fi
          # Ubuntu blocks the unprivileged user namespaces Chromium's sandbox needs, which makes
          # Electron refuse to start. The fixture can fall back to --no-sandbox if this fails.
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: ${{ inputs.github-hosted && 'pnpm' || '' }}

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron is not in allowBuilds, so its postinstall never fetched the runtime. The CDN is
      # occasionally flaky, hence the retries.
      - name: Install Electron binary
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @agentmat/desktop exec install-electron && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build workspace packages
        run: pnpm build:packages

      # better-sqlite3 has to match Electron's ABI to load inside the app.
      - name: Rebuild native modules for Electron
        run: pnpm --filter @agentmat/desktop rebuild:native

      - name: Git identity for fixtures
        shell: bash
        run: |
          git config --global user.name "AgentMate CI"
          git config --global user.email "ci@agentmate.invalid"

      # The Deploy spec builds and starts the server core's DevHost, so it runs on every OS.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: ${{ inputs.github-hosted }}
          cache-dependency-path: apps/server-core/**/packages.lock.json

      # Electron needs a display server. Playwright itself needs no browser download here,
      # because the _electron launcher drives the app's own runtime.
      - name: Playwright (Linux)
        if: runner.os == 'Linux'
        # Hosted runners have no usable Chromium sandbox even after the sysctl above, so the
        # launcher drops it here rather than having Electron refuse to start.
        env:
          AGENTMATE_E2E_NO_SANDBOX: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm --filter @agentmat/desktop test:e2e --shard=${{ matrix.shard }}/3

      - name: Playwright
        if: runner.os != 'Linux'
        run: pnpm --filter @agentmat/desktop test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.target.name }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
