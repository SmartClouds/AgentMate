name: Nightly

# The Deploy system tests on the full test-server matrix: every supported distro and both firewall
# backends, one test server per job, the full-stack e2e run on Ubuntu and Rocky (E17 AC1), and the
# server core's own nginx and Pebble system tests.
# Each `[e2e]` push runs a smaller set (Ubuntu and Rocky installs, ufw and firewalld, Ubuntu for the
# rest; see the server-core-system job in test.yml).
# This one runs every night and by hand, never on a push, on the self-hosted Linux runner like
# the rest of CI. The jobs queue one after another on it.
#
# Each job sets AGENTMATE_TEST_SERVER_IMAGES to its image, and every system test runs on it when it
# supports it (see testServerImages in apps/desktop/src/main/deploy/testing/testServers.ts). A test
# that needs something else (a firewall, the Rocky-only podman case) is skipped in that job.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  system:
    name: System tests (${{ matrix.image }})
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, debian-13, rocky-9, ubuntu-24.04-ufw, rocky-9-firewalld]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: apps/server-core/**/packages.lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Publish the linux-x64 release
        run: node scripts/server-core.mjs publish linux-x64

      # The same AppArmor profile as in test.yml: it confines the Rocky servers' unix_chkpwd too.
      - name: Let the Rocky test servers check passwords
        run: |
          if sudo grep -q '^unix-chkpwd ' /sys/kernel/security/apparmor/profiles 2>/dev/null; then
            echo -n unix-chkpwd | sudo tee /sys/kernel/security/apparmor/.remove > /dev/null
            echo "Unloaded the runner's unix-chkpwd AppArmor profile."
          fi

      # Built up front, so the image build does not count against a test's time limit. The
      # firewall variants build on their distro's image, so that one comes first.
      - name: Build the test server
        run: |
          image="${{ matrix.image }}"
          base="${image%-ufw}"
          base="${base%-firewalld}"
          docker build -q -t "agentmate-test-server:$base" "apps/server-core/test-servers/$base"
          if [ "$base" != "$image" ]; then
            docker build -q -t "agentmate-test-server:$image" "apps/server-core/test-servers/$image"
          fi

      # One file at a time: each boots whole machines, and two at once only slow each other down.
      - name: System tests on ${{ matrix.image }}
        env:
          AGENTMATE_SYSTEM_TESTS: "1"
          AGENTMATE_TEST_SERVER_IMAGES: ${{ matrix.image }}
        run: >-
          pnpm --filter @agentmat/desktop exec vitest run --project main --no-file-parallelism
          src/main/deploy/deploy.int.test.ts
          src/main/deploy/docker.int.test.ts
          src/main/deploy/stacks.int.test.ts
          src/main/deploy/registries.int.test.ts
          src/main/deploy/deployExec.int.test.ts
          src/main/deploy/security.int.test.ts
          src/main/deploy/firewall.int.test.ts
          src/main/deploy/directTls.int.test.ts
          src/main/deploy/appStoreHttps.int.test.ts

  # E17 AC1: the whole story in one run, with Playwright driving the built app against a test
  # server (deployFullStack.e2e.ts): install, two-factor, Docker, a stack with an environment, a
  # private pull, a site with a Pebble certificate, a firewall revert and a fix from the Deploy AI.
  # The firewall variants of Ubuntu and Rocky, since one step needs a firewall.
  full-stack:
    name: Full-stack e2e (${{ matrix.image }})
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04-ufw, rocky-9-firewalld]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Display and Electron libraries
        run: |
          # Everything Electron links against. GitHub's hosted images ship most of these already,
          # a plain Ubuntu server does not (GTK and ATK above all).
          installed() { dpkg-query -W -f='${Status}' "$1" 2> /dev/null | grep -q "install ok installed"; }
          missing=""
          for p in xvfb libnss3 libnspr4 libgbm1 libdrm2 libxss1 libxtst6 libx11-6 libxcb1 libxext6 \
            libxfixes3 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libdbus-1-3 libpango-1.0-0 \
            libcairo2 libwayland-client0 libasound2 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libglib2.0-0 libgtk-3-0; do
            # Ubuntu 24.04 renamed some of these with a t64 suffix (libasound2t64, libgtk-3-0t64, ...).
            if installed "$p" || installed "${p}t64"; then continue; fi
            if apt-cache show "${p}t64" > /dev/null 2>&1; then
              missing="$missing ${p}t64"
            else
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            if ! sudo -n true 2> /dev/null; then
              echo "::error::Missing system packages:$missing. This runner has no passwordless sudo, so install them on the runner host: sudo apt-get install -y$missing"
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y $missing
          fi
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: apps/server-core/**/packages.lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @agentmat/desktop exec install-electron && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Rebuild native modules for Electron
        run: pnpm --filter @agentmat/desktop rebuild:native

      - name: Git identity for fixtures
        run: |
          git config --global user.name "AgentMate CI"
          git config --global user.email "ci@agentmate.invalid"

      - name: Publish the linux-x64 release
        run: node scripts/server-core.mjs publish linux-x64

      - name: Let the Rocky test servers check passwords
        run: |
          if sudo grep -q '^unix-chkpwd ' /sys/kernel/security/apparmor/profiles 2>/dev/null; then
            echo -n unix-chkpwd | sudo tee /sys/kernel/security/apparmor/.remove > /dev/null
            echo "Unloaded the runner's unix-chkpwd AppArmor profile."
          fi

      - name: Build the test server
        run: |
          image="${{ matrix.image }}"
          base="${image%-ufw}"
          base="${base%-firewalld}"
          docker build -q -t "agentmate-test-server:$base" "apps/server-core/test-servers/$base"
          docker build -q -t "agentmate-test-server:$image" "apps/server-core/test-servers/$image"

      - name: Full stack on ${{ matrix.image }}
        env:
          AGENTMATE_SYSTEM_TESTS: "1"
          AGENTMATE_TEST_SERVER_IMAGES: ${{ matrix.image }}
          AGENTMATE_E2E_NO_SANDBOX: "1"
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter @agentmat/desktop test:e2e deployFullStack.e2e.ts

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-${{ matrix.image }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results

  # E19 to E21: Playwright driving the built app against the AgentMate Connector on WordPress in
  # Docker (deployWordPress.e2e.ts): connect with a key, a WordPress project, a deploy that leaves
  # agent files behind, a refused syntax error, a rollback by the site's guard and one by hand.
  wordpress-e2e:
    name: WordPress e2e
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Display and Electron libraries
        run: |
          # Everything Electron links against. GitHub's hosted images ship most of these already,
          # a plain Ubuntu server does not (GTK and ATK above all).
          installed() { dpkg-query -W -f='${Status}' "$1" 2> /dev/null | grep -q "install ok installed"; }
          missing=""
          for p in xvfb libnss3 libnspr4 libgbm1 libdrm2 libxss1 libxtst6 libx11-6 libxcb1 libxext6 \
            libxfixes3 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libdbus-1-3 libpango-1.0-0 \
            libcairo2 libwayland-client0 libasound2 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libcups2 libglib2.0-0 libgtk-3-0; do
            # Ubuntu 24.04 renamed some of these with a t64 suffix (libasound2t64, libgtk-3-0t64, ...).
            if installed "$p" || installed "${p}t64"; then continue; fi
            if apt-cache show "${p}t64" > /dev/null 2>&1; then
              missing="$missing ${p}t64"
            else
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            if ! sudo -n true 2> /dev/null; then
              echo "::error::Missing system packages:$missing. This runner has no passwordless sudo, so install them on the runner host: sudo apt-get install -y$missing"
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y $missing
          fi
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @agentmat/desktop exec install-electron && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Rebuild native modules for Electron
        run: pnpm --filter @agentmat/desktop rebuild:native

      - name: Build the connector zip
        run: node scripts/wordpress-connector.mjs build

      - name: WordPress end to end
        env:
          AGENTMATE_SYSTEM_TESTS: "1"
          AGENTMATE_E2E_NO_SANDBOX: "1"
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          pnpm --filter @agentmat/desktop test:e2e deployWordPress.e2e.ts

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: wordpress-e2e
          retention-days: 14
          if-no-files-found: ignore
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results

  # The server core's own system tests (xUnit): every nginx renderer variant through a real
  # nginx -t on nginx.org's packages for Debian 13 and Rocky 9 (E10), and certificates issued and
  # renewed by Pebble through real nginx (E11). They need Linux with Docker, which no push runs.
  server-core-system:
    name: Server core system tests (nginx and Pebble)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        working-directory: apps/server-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        # The default, /usr/share/dotnet, needs root, which a self-hosted runner may not have.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.4xx
          cache: true
          cache-dependency-path: apps/server-core/**/packages.lock.json

      - name: Restore
        run: dotnet restore AgentMate.ServerCore.slnx --locked-mode

      - name: Build
        run: dotnet build AgentMate.ServerCore.slnx --no-restore --configuration Release

      - name: System tests
        run: dotnet test --project tests/AgentMate.ServerCore.SystemTests --no-build --configuration Release
