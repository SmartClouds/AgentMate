<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0E1116; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .title { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; color: #F5F5F5;
    font: 300 6vmin/1.2 Vazirmatn, Inter, sans-serif; letter-spacing: 0.02em; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path id="p0" stroke="#7FDBCA" d="M200 600 C 350 300, 550 300, 700 450 S 1000 650, 1150 400"/>
    <path id="p1" stroke="#F5F5F5" d="M700 450 L 700 250 L 900 250"/>
    <path id="p2" stroke="#F7C548" d="M1150 400 m -60 0 a 60 60 0 1 0 120 0 a 60 60 0 1 0 -120 0"/>
    <path id="p3" stroke="#7FDBCA" d="M200 600 m -40 0 a 40 40 0 1 0 80 0 a 40 40 0 1 0 -80 0"/>
    <path id="p4" stroke="#F5F5F5" d="M900 250 L 1350 250 L 1350 180"/>
  </g>
</svg>
<div class="title" id="title"></div>
<script>
// Line art: single-weight lines draw themselves on, calm and even, connecting the ideas.
const COPY = { fa: 'از ایده تا نتیجه', en: 'From idea to result' };
const paths = [0, 1, 2, 3, 4].map((i) => document.getElementById(`p${i}`));
const lengths = paths.map((p) => p.getTotalLength());
const title = document.getElementById('title');

Studio.scene({
  setup(ctx) {
    title.lang = ctx.lang;
    title.dir = ctx.dir;
    title.textContent = COPY[ctx.lang] ?? COPY.en;
    paths.forEach((p, i) => { p.style.strokeDasharray = `${lengths[i]}`; });
  },
  render(t, ctx) {
    // The first stroke is already started at frame zero, so the scene never opens on an empty frame.
    const spans = [[-0.4, 2.4], [1.6, 2.8], [2.2, 3.4], [0, 1], [2.8, 4]];
    paths.forEach((p, i) => {
      const [a, b] = spans[i];
      const drawn = ctx.ease.inOut(ctx.between(a * ctx.duration / 6, b * ctx.duration / 6));
      p.style.strokeDashoffset = String(lengths[i] * (1 - drawn));
    });
    const show = ctx.ease.out(ctx.between(ctx.duration * 0.55, ctx.duration * 0.8));
    title.style.opacity = String(show);
    title.style.transform = `translateY(${(1 - show) * 20}px)`;
  },
});
</script>
</body>
</html>
