<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #FBF7EF; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .caption { position: absolute; left: 0; right: 0; bottom: 14%; text-align: center; color: #1F1F1F;
    font: 700 7vmin/1.2 Vazirmatn, Inter, sans-serif; }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
<div class="caption" id="caption"></div>
<script>
// Line boil: hand-drawn outlines redrawn with a small jitter twelve times a second.
const COPY = { fa: 'هر قطره مهم است', en: 'Every drop counts' };
const art = document.getElementById('art');
const caption = document.getElementById('caption');

function wobblyPath(points, seed, amount) {
  return points.map(([x, y], i) => {
    const dx = (Studio.noiseAt(seed, i, 0) - 0.5) * amount;
    const dy = (Studio.noiseAt(seed, i, 1) - 0.5) * amount;
    return `${i ? 'L' : 'M'}${(x + dx).toFixed(1)} ${(y + dy).toFixed(1)}`;
  }).join(' ') + ' Z';
}

function drop(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 40; i++) {
    const a = (i / 40) * Math.PI * 2;
    const tip = Math.max(0, -Math.sin(a));
    pts.push([cx + Math.cos(a) * r * (1 - tip * 0.6), cy + Math.sin(a) * r - tip * tip * r * 0.9]);
  }
  return pts;
}

Studio.noiseAt = (seed, i, k) => {
  let h = (seed * 374761393 + i * 668265263 + k * 2147483647) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};

Studio.scene({
  setup(ctx) {
    caption.lang = ctx.lang;
    caption.dir = ctx.dir;
    caption.textContent = COPY[ctx.lang] ?? COPY.en;
  },
  render(t, ctx) {
    const boil = Math.floor(t * 12);
    const fall = ctx.ease.outBounce(ctx.between(0, ctx.duration * 0.45));
    const y = 120 + fall * 380;
    const ripple = ctx.between(ctx.duration * 0.45, ctx.duration);
    const rings = [0, 1, 2].map((k) => {
      const p = Math.max(0, Math.min(1, ripple * 1.6 - k * 0.3));
      const r = 40 + p * 260;
      const pts = Array.from({ length: 36 }, (_, i) => {
        const a = (i / 36) * Math.PI * 2;
        return [500 + Math.cos(a) * r, 640 + Math.sin(a) * r * 0.28];
      });
      return `<path d="${wobblyPath(pts, boil + k * 7, 10)}" fill="none" stroke="#29335C" stroke-width="7" opacity="${(1 - p).toFixed(2)}"/>`;
    }).join('');
    art.innerHTML =
      `<path d="${wobblyPath([[80, 700], [920, 700], [920, 720], [80, 720]], boil + 3, 8)}" fill="#1F1F1F"/>` +
      rings +
      `<path d="${wobblyPath(drop(500, y, 70), boil, 9)}" fill="#E4572E" stroke="#1F1F1F" stroke-width="9" stroke-linejoin="round"/>`;
    caption.style.opacity = String(0.35 + 0.65 * ctx.ease.out(ctx.between(ctx.duration * 0.3, ctx.duration * 0.6)));
  },
});
</script>
</body>
</html>
