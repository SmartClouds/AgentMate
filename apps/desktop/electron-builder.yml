appId: com.runova.app
productName: Runova
executableName: Runova
directories:
  output: release

# node-pty is N-API based and ships working prebuilt binaries for every
# platform we target. electron-builder's default native-rebuild step tries
# to compile it from source instead, which fails because the npm-published
# tarball is missing the winpty git submodule's build scripts. Skip it.
npmRebuild: false

# node-pty starts every macOS terminal through its spawn-helper, which version 1.1.0 ships
# without the execute bit. The hook repairs the staged copy and fails the packaging when the
# bit is still missing afterwards, so a broken helper can never ship again.
afterPack: ./scripts/after-pack-spawn-helper.cjs

# Window and notification icons: the .ico on Windows, the PNG on Linux (Electron reads no .ico
# there). macOS takes the bundle's .icns and needs neither.
files:
  - out/**/*
  - package.json
  - resources/icon.ico
  - resources/icon.png

extraResources:
  - from: resources/example-skill-repo
    to: example-skill-repo
  # Studio's fonts, style reference scenes and scene runtime (E33). Its code is bundled into the
  # main process, which then reads these from resources/studio (see main/studio/host.ts).
  - from: ../../packages/studio/assets
    to: studio/assets
  - from: ../../packages/studio/dist/bundle
    to: studio/dist/bundle
  # The server core release manifest, which CD downloads into build/ before packaging. The app
  # only installs a server core whose hash is listed here. A local build without it packages
  # fine (electron-builder only warns) and its Deploy section says it has no core to install.
  - from: build/server-core-manifest.json
    to: server-core-manifest.json
  # The Runova Connector WordPress plugin (E19), built by `node scripts/wordpress-connector.mjs
  # build` (CD runs it before packaging). Deploy offers it as a download for wp-admin. Without
  # it the app still packages; the download button then says the zip is missing.
  - from: ../wordpress-connector/dist/runova-connector.zip
    to: wordpress-connector/runova-connector.zip

# node-pty ships native .node/.dll/.exe files that must exist as real files on
# disk (it also spawns conpty/winpty helper executables at runtime); they
# can't be loaded from inside the asar archive.
#
# onnxruntime-node (pulled in by @huggingface/transformers for local Whisper
# speech-to-text) is the same story: it dlopen's prebuilt .node/.dll/.so files
# that have to live on the real filesystem, not inside the archive.
#
# The usage scan worker is started via `new Worker(<path>)`; the module loader
# inside a worker thread reads off the real filesystem rather than through
# Electron's asar shim, so the worker entry AND the chunk it shares with the
# main bundle both have to exist unpacked.
#
# The terminal host runs the app's exe in plain Node mode, which can't read inside the
# archive at all, so its entry (and the shared chunks above) must be unpacked too.
#
# The workspace search starts ripgrep as a program, and a program can't be run from
# inside the archive either. The binary lives in a per-platform package beside
# @vscode/ripgrep, hence the wildcard.
#
# The Help index loads sqlite-vec's vec0 library into SQLite as an extension, and SQLite
# opens it from a real path, so the per-platform packages beside sqlite-vec are unpacked too.
asarUnpack:
  - '**/node_modules/@vscode/ripgrep*/**'
  - '**/node_modules/sqlite-vec*/**'
  - '**/node_modules/node-pty/**'
  - '**/node_modules/onnxruntime-node/**'
  - 'out/main/ptyHost.mjs'
  - 'out/main/usageScanWorker.mjs'
  - 'out/main/projectUsageWorker.mjs'
  - 'out/main/codeqlExtractWorker.mjs'
  - 'out/main/chunks/**'

# Each OS gets icons drawn for it: Windows a multi-size .ico whose small sizes have bolder
# strokes, macOS Apple's icon grid (824 px body on 1024, with its shadow), Linux the hicolor
# PNG set.
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Default artifactName has spaces ("Runova Setup 1.1.0.exe"). GitHub
  # renames uploaded assets with spaces to dots on download, but the
  # latest.yml electron-builder writes for electron-updater sanitizes spaces
  # to dashes instead - the two disagree and auto-update downloads 404. Keep
  # this dash-only, matching the other platforms' artifact names.
  artifactName: ${productName}-Setup-${version}.${ext}
  # The app was called AgentMate before, and electron-builder derives this id from the appId it  # legacy-name
  # had then (com.agentmate.app). Keeping it makes the Runova installer an upgrade of that install  # legacy-name
  # (same uninstall entry, the old shortcuts removed) instead of a second app beside it.
  guid: 76b8d710-e984-550c-8238-6729e4607618

mac:
  icon: resources/icon-mac.png
  # There is no Apple Developer ID, so sign ad-hoc ("-"). Left unsigned, the arm64 build
  # won't open on Apple Silicon at all ("Runova is damaged"), because arm64 code must
  # carry a valid signature; the x64 build only got away with it by running under Rosetta.
  # Hardened runtime and notarization both need a real identity, so they are off.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  # Required for Prompt Builder's voice input: macOS crashes the app on mic
  # access unless this usage string is present in Info.plist.
  extendInfo:
    NSMicrophoneUsageDescription: Runova uses the microphone to transcribe your voice into the Prompt Builder.
  target:
    - target: dmg
      arch: [x64, arm64]
    # electron-updater's macOS auto-update path (Squirrel.Mac) downloads the
    # zip, not the dmg; the dmg is only for first-time manual installs.
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools

linux:
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development

# The deb target's default artifact name embeds the raw package.json "name"
# ("@runova/desktop"), which contains a slash and would build to a nested
# path (release/@runova/desktop_1.0.0_amd64.deb) that the CD workflow's
# `apps/desktop/release/*.deb` upload glob can't see. Use productName instead.
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # The package was named agentmate before the rename. Taking its place lets dpkg upgrade it  # legacy-name
  # instead of installing Runova beside it.
  fpm: ['--replaces=agentmate', '--conflicts=agentmate']  # legacy-name

# electron-updater reads this to know where to look for new releases. The CD
# workflow builds with `--publish never` and uploads artifacts to the GitHub
# Release itself (see .github/workflows/cd.yml), so this only needs to name
# the repo; electron-updater talks to the GitHub Releases API directly.
publish:
  provider: github
  owner: SmartClouds
  repo: Runova
  releaseType: release
