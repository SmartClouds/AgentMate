# ProFTPD for the E23 tests. entrypoint.sh appends PassivePorts and MasqueradeAddress.
Include /etc/proftpd/modules.conf
LoadModule mod_tls.c
LoadModule mod_sftp.c

ServerName "AgentMate e2e FTP"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
User proftpd
Group nogroup
Umask 022 022
AllowOverwrite on
RequireValidShell off
UseReverseDNS off
UseFtpUsers off
WtmpLog off
TimesGMT on
MaxInstances 30

<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired off
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/proftpd/tls/cert.pem
  TLSRSACertificateKeyFile /etc/proftpd/tls/key.pem
  TLSVerifyClient off
  TLSLog /var/log/proftpd/tls.log
</IfModule>

<VirtualHost 0.0.0.0>
  Port 2222
  SFTPEngine on
  SFTPLog /var/log/proftpd/sftp.log
  SFTPHostKey /etc/proftpd/ssh_host_rsa_key
  SFTPAuthMethods password
  RequireValidShell off
  Umask 022 022
  AllowOverwrite on
  TLSEngine off
</VirtualHost>
