# vsftpd for the E23 tests: the LIST-only server. entrypoint.sh appends the passive ports.
listen=YES
listen_port=2121
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chmod_enable=YES
chroot_local_user=NO
force_dot_files=YES
utf8_filesystem=YES
seccomp_sandbox=NO
pam_service_name=vsftpd
secure_chroot_dir=/var/run/vsftpd/empty
xferlog_enable=NO
pasv_enable=YES
pasv_addr_resolve=NO
